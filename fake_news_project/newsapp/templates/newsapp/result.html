
<html>
<head>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gradient-to-r from-blue-500 to-indigo-600 h-screen flex items-center justify-center">

<div class="bg-white p-10 rounded-2xl shadow-xl text-center w-[500px]">

  <h1 class="text-4xl font-bold mb-6 text-gray-800">
    Result 🔍
  </h1>

  <p class="text-gray-500 mb-4">
    Your News:
  </p>

  <div class="bg-gray-100 p-4 rounded-lg mb-6 text-gray-700">
    {{ text }}
  </div>

  <!-- RESULT BADGE -->
  {% if "Fake" in result %}
    <div class="bg-red-100 text-red-600 px-4 py-2 rounded-lg mb-6 font-semibold">
      {{ result }}
    </div>
  {% else %}
    <div class="bg-green-100 text-green-600 px-4 py-2 rounded-lg mb-6 font-semibold">
      {{ result }}
    </div>
  {% endif %}

  <a href="/" 
     class="bg-blue-500 text-white px-6 py-2 rounded-lg hover:bg-blue-600 transition">
    🔙 Check Another News
  </a>

</div>

</body>
</html>
